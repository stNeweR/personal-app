version: "3"

silent: true

tasks:
  build:
    desc: Сборка всех контейнеров
    cmds:
      - docker compose build
      
  up:
    desc: Запуск всех сервисов
    cmds:
      - docker compose up -d

  up-lt:
    desc: Запуск всех сервисов и localtunnel (Vite на 5173, API проксируется на app:9000)
    cmds:
      - docker compose up -d
      - sleep 1
      - lt --port 5173 --subdomain my-bot

  up-se:
    desc: Запуск всех сервисов и serveo
    cmds:
      - docker compose up -d
      - sleep 1
      - ssh -R my-bot:80:localhost:5173 serveo.net

  down:
    desc: Остановка всех сервисов
    cmds:
      - docker compose down

  shell:
    desc: Попасть в контейнер php
    cmds:
      - docker exec -it bot_app sh


  node:
    desc: Попасть в контейнер node
    cmds:
      - docker exec -it bot_node sh

  logs:
    desc: Просмотр логов
    cmds:
      - docker compose logs -f

  pint:
    desc: Запуск laravel pint
    cmds:
      - docker compose exec -t app ./vendor/bin/pint

  stan:
    desc: Запуск phpstan
    cmds:
      - docker compose exec -t app ./vendor/bin/phpstan analyse --debug --memory-limit=1G

  test:
    desc: Запуск тестов
    cmds:
      - docker compose exec -t app php artisan test

  composer-install:
    desc: Запуск composer install
    cmds:
      - docker compose exec app composer install

  npm-install:
    desc: Установка npm-зависимостей в контейнере (синхронизируется с хостом)
    cmds:
      - docker compose exec node npm install

  composer-update:
    desc: Запуск composer update
    cmds:
      - docker compose exec app composer update

  plugin-build:
    desc: Сборка Go-плагинов в shared library
    cmds:
      - cd plugins && CGO_ENABLED=1 go build -buildmode=c-shared -o ../backend/storage/app/plugins/libplugins.so -ldflags="-s -w" .

  plugin-test:
    desc: Тесты Go-плагинов
    cmds:
      - cd plugins && go test ./...

  plugin-clean:
    desc: Очистка скомпилированных плагинов
    cmds:
      - rm -f backend/storage/app/plugins/libplugins.so backend/storage/app/plugins/libplugins.h

  prep:
    desc: Подготовка перед коммитом
    cmds:
      - task: pint
      - task: stan
      - task: test
